name: Deploy to Staging

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/ssi
  KUSTOMIZE_VERSION: '5.3.0'

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment: staging

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: ${{ env.KUSTOMIZE_VERSION }}

      - name: Set image tags to current SHA
        working-directory: backend/k8s/overlays/development
        run: |
          kustomize edit set image \
            backend=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:${{ github.event.workflow_run.head_sha }} \
            issuer-verifier=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-issuer-verifier:${{ github.event.workflow_run.head_sha }} \
            web-wallet=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-web-wallet:${{ github.event.workflow_run.head_sha }}

      - name: Build Kustomize manifests
        run: kustomize build backend/k8s/overlays/development > /tmp/staging-manifests.yaml

      - name: Validate manifests
        run: |
          # Dry-run validation (no cluster needed)
          cat /tmp/staging-manifests.yaml | head -50
          echo "--- Manifest generated: $(wc -l < /tmp/staging-manifests.yaml) lines ---"

      - name: Deploy to staging cluster
        if: ${{ secrets.KUBE_CONFIG_STAGING != '' }}
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > ~/.kube/config
          kubectl apply -f /tmp/staging-manifests.yaml
          kubectl -n ai-identity-dev rollout status deployment --timeout=300s

      - name: Upload manifests artifact
        uses: actions/upload-artifact@v4
        with:
          name: staging-manifests
          path: /tmp/staging-manifests.yaml
          retention-days: 7

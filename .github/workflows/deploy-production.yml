name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag to deploy (commit SHA or semver tag)'
        required: true
        type: string
      confirm:
        description: 'Type "deploy-production" to confirm'
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/ssi
  KUSTOMIZE_VERSION: '5.3.0'

jobs:
  validate:
    name: Validate Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Confirm deployment intent
        if: ${{ github.event.inputs.confirm != 'deploy-production' }}
        run: |
          echo "::error::Deployment not confirmed. Type 'deploy-production' in the confirm field."
          exit 1

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [validate]
    environment: production

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: ${{ env.KUSTOMIZE_VERSION }}

      - name: Set image tags
        working-directory: backend/k8s/overlays/production
        run: |
          kustomize edit set image \
            backend=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:${{ github.event.inputs.image_tag }} \
            issuer-verifier=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-issuer-verifier:${{ github.event.inputs.image_tag }} \
            web-wallet=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-web-wallet:${{ github.event.inputs.image_tag }}

      - name: Build Kustomize manifests
        run: kustomize build backend/k8s/overlays/production > /tmp/production-manifests.yaml

      - name: Validate manifests
        run: |
          cat /tmp/production-manifests.yaml | head -50
          echo "--- Manifest generated: $(wc -l < /tmp/production-manifests.yaml) lines ---"

      - name: Deploy to production cluster
        if: ${{ secrets.KUBE_CONFIG_PRODUCTION != '' }}
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > ~/.kube/config
          kubectl apply -f /tmp/production-manifests.yaml
          kubectl -n ai-identity-prod rollout status deployment --timeout=600s

      - name: Upload manifests artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-manifests
          path: /tmp/production-manifests.yaml
          retention-days: 30

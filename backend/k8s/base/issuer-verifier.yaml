apiVersion: apps/v1
kind: Deployment
metadata:
  name: issuer-verifier
  namespace: ai-identity
  labels:
    app.kubernetes.io/name: issuer-verifier
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: ai-agent-identity-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: issuer-verifier
  template:
    metadata:
      labels:
        app.kubernetes.io/name: issuer-verifier
        app.kubernetes.io/component: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
      containers:
        - name: issuer-verifier
          image: ghcr.io/sefatuncer/ssi-issuer-verifier:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5174
              protocol: TCP
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: issuer-verifier
  namespace: ai-identity
  labels:
    app.kubernetes.io/name: issuer-verifier
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 5174
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: issuer-verifier
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: issuer-verifier-hpa
  namespace: ai-identity
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: issuer-verifier
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: issuer-verifier-pdb
  namespace: ai-identity
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: issuer-verifier

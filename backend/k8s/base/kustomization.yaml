apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: ai-identity-base

namespace: ai-identity

resources:
  - namespace.yaml
  - rbac.yaml
  - configmap.yaml
  - secret.yaml
  - postgres.yaml
  - redis.yaml
  - issuer.yaml
  - verifier.yaml
  - holder.yaml
  - api-gateway.yaml
  - web-wallet.yaml
  - issuer-verifier.yaml
  - ingress.yaml

commonLabels:
  app.kubernetes.io/part-of: ai-agent-identity-system
  app.kubernetes.io/managed-by: kustomize

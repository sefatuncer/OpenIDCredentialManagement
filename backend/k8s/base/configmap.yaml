apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-identity-config
  namespace: ai-identity
  labels:
    app.kubernetes.io/name: ai-identity
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"

  # API Configuration
  API_PORT: "3000"
  HTTPS_PORT: "3443"

  # Internal Service URLs
  ISSUER_URL: "http://issuer:3001"
  VERIFIER_URL: "http://verifier:3002"
  HOLDER_URL: "http://holder:3003"

  # Rate Limiting
  RATE_LIMIT_WINDOW_MS: "60000"
  RATE_LIMIT_MAX_REQUESTS: "100"

  # TLS Configuration
  TLS_ENABLED: "false"
  TLS_MIN_VERSION: "TLSv1.2"
  TLS_REQUEST_CERT: "false"
  TLS_REJECT_UNAUTHORIZED: "true"

  # OpenID4VC Configuration
  CREDENTIAL_ISSUER_ID: "ai-identity-issuer"

  # Metrics
  ENABLE_METRICS: "true"
  SLOW_REQUEST_THRESHOLD: "3000"

apiVersion: v1
kind: Secret
metadata:
  name: ai-identity-secrets
  namespace: ai-identity
  labels:
    app.kubernetes.io/name: ai-identity
type: Opaque
stringData:
  # IMPORTANT: Replace these values in production!
  # Use external secret management (Vault, AWS Secrets Manager, etc.)
  JWT_SECRET: "change-this-in-production-use-strong-secret"
  API_KEY: "change-this-api-key-in-production"

  # Wallet Keys (each agent needs unique key)
  ISSUER_WALLET_KEY: "issuer-wallet-key-change-me"
  VERIFIER_WALLET_KEY: "verifier-wallet-key-change-me"
  HOLDER_WALLET_KEY: "holder-wallet-key-change-me"

  # Database
  POSTGRES_USER: "aiagent"
  POSTGRES_PASSWORD: "change-this-password"
  POSTGRES_DB: "ai_identity"
  DATABASE_URL: "postgresql://aiagent:change-this-password@postgres:5432/ai_identity"

  # Redis
  REDIS_URL: "redis://redis:6379"

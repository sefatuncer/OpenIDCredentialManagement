apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-identity-ingress
  namespace: ai-identity
  labels:
    app.kubernetes.io/name: ai-identity
  annotations:
    # Nginx Ingress Controller annotations
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"

    # Rate limiting
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-connections: "50"

    # CORS (if needed)
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization, Content-Type, X-API-Key, X-Request-ID"

    # For cert-manager TLS
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - ai-identity.example.com
      secretName: ai-identity-tls
  rules:
    - host: ai-identity.example.com
      http:
        paths:
          # Health & Metrics (public)
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 3000
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 3000

          # API endpoints
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 3000

          # Web Wallet Frontend
          - path: /wallet
            pathType: Prefix
            backend:
              service:
                name: web-wallet
                port:
                  number: 5173

          # Issuer/Verifier Dashboard
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: issuer-verifier
                port:
                  number: 5174

          # Default: serve web-wallet
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-wallet
                port:
                  number: 5173
---
# Network Policy - restrict traffic between pods
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ai-identity-network-policy
  namespace: ai-identity
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow ingress from same namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ai-identity
    # Allow ingress from ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
  egress:
    # Allow egress to same namespace
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ai-identity
    # Allow DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
    # Allow external HTTPS (for OpenID4VC)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443

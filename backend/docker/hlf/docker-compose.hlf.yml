##
## Hyperledger Fabric Network for SSI Credential Anchoring
## Usage: docker compose -f docker/hlf/docker-compose.hlf.yml up -d
## Setup: docker exec hlf-cli /scripts/setup-channel.sh
##

version: '3.8'

volumes:
  orderer.data:
  peer0.org1.data:
  peer1.org1.data:
  peer0.org2.data:
  peer1.org2.data:

networks:
  hlf-net:
    name: hlf-ssi-network

services:
  # --- Orderer ---
  orderer.ssi.network:
    container_name: hlf-orderer
    image: hyperledger/fabric-orderer:2.5
    environment:
      - ORDERER_GENERAL_LISTENADDRESS=0.0.0.0
      - ORDERER_GENERAL_LISTENPORT=7050
      - ORDERER_GENERAL_LOCALMSPID=OrdererMSP
      - ORDERER_GENERAL_LOCALMSPDIR=/var/hyperledger/orderer/msp
      - ORDERER_GENERAL_GENESISMETHOD=file
      - ORDERER_GENERAL_GENESISFILE=/var/hyperledger/orderer/orderer.genesis.block
      - ORDERER_GENERAL_TLS_ENABLED=false
      - ORDERER_GENERAL_LOGLEVEL=INFO
    volumes:
      - ./channel-artifacts/genesis.block:/var/hyperledger/orderer/orderer.genesis.block
      - ./crypto-config/ordererOrganizations/ssi.network/orderers/orderer.ssi.network/msp:/var/hyperledger/orderer/msp
      - orderer.data:/var/hyperledger/production/orderer
    ports:
      - "7050:7050"
    networks:
      - hlf-net

  # --- Org1 Peers ---
  peer0.org1.ssi.network:
    container_name: hlf-peer0-org1
    image: hyperledger/fabric-peer:2.5
    environment:
      - CORE_PEER_ID=peer0.org1.ssi.network
      - CORE_PEER_ADDRESS=peer0.org1.ssi.network:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.org1.ssi.network:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer1.org1.ssi.network:8051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.org1.ssi.network:7051
      - CORE_PEER_LOCALMSPID=Org1MSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_PEER_TLS_ENABLED=false
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=hlf-ssi-network
      - FABRIC_LOGGING_SPEC=INFO
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./crypto-config/peerOrganizations/org1.ssi.network/peers/peer0.org1.ssi.network/msp:/etc/hyperledger/fabric/msp
      - peer0.org1.data:/var/hyperledger/production
    ports:
      - "7051:7051"
    depends_on:
      - orderer.ssi.network
    networks:
      - hlf-net

  peer1.org1.ssi.network:
    container_name: hlf-peer1-org1
    image: hyperledger/fabric-peer:2.5
    environment:
      - CORE_PEER_ID=peer1.org1.ssi.network
      - CORE_PEER_ADDRESS=peer1.org1.ssi.network:8051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:8051
      - CORE_PEER_CHAINCODEADDRESS=peer1.org1.ssi.network:8052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:8052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.org1.ssi.network:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer1.org1.ssi.network:8051
      - CORE_PEER_LOCALMSPID=Org1MSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_PEER_TLS_ENABLED=false
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=hlf-ssi-network
      - FABRIC_LOGGING_SPEC=INFO
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./crypto-config/peerOrganizations/org1.ssi.network/peers/peer1.org1.ssi.network/msp:/etc/hyperledger/fabric/msp
      - peer1.org1.data:/var/hyperledger/production
    ports:
      - "8051:8051"
    depends_on:
      - orderer.ssi.network
    networks:
      - hlf-net

  # --- Org2 Peers ---
  peer0.org2.ssi.network:
    container_name: hlf-peer0-org2
    image: hyperledger/fabric-peer:2.5
    environment:
      - CORE_PEER_ID=peer0.org2.ssi.network
      - CORE_PEER_ADDRESS=peer0.org2.ssi.network:9051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:9051
      - CORE_PEER_CHAINCODEADDRESS=peer0.org2.ssi.network:9052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:9052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer1.org2.ssi.network:10051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.org2.ssi.network:9051
      - CORE_PEER_LOCALMSPID=Org2MSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_PEER_TLS_ENABLED=false
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=hlf-ssi-network
      - FABRIC_LOGGING_SPEC=INFO
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./crypto-config/peerOrganizations/org2.ssi.network/peers/peer0.org2.ssi.network/msp:/etc/hyperledger/fabric/msp
      - peer0.org2.data:/var/hyperledger/production
    ports:
      - "9051:9051"
    depends_on:
      - orderer.ssi.network
    networks:
      - hlf-net

  peer1.org2.ssi.network:
    container_name: hlf-peer1-org2
    image: hyperledger/fabric-peer:2.5
    environment:
      - CORE_PEER_ID=peer1.org2.ssi.network
      - CORE_PEER_ADDRESS=peer1.org2.ssi.network:10051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:10051
      - CORE_PEER_CHAINCODEADDRESS=peer1.org2.ssi.network:10052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:10052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer0.org2.ssi.network:9051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer1.org2.ssi.network:10051
      - CORE_PEER_LOCALMSPID=Org2MSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_PEER_TLS_ENABLED=false
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=hlf-ssi-network
      - FABRIC_LOGGING_SPEC=INFO
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./crypto-config/peerOrganizations/org2.ssi.network/peers/peer1.org2.ssi.network/msp:/etc/hyperledger/fabric/msp
      - peer1.org2.data:/var/hyperledger/production
    ports:
      - "10051:10051"
    depends_on:
      - orderer.ssi.network
    networks:
      - hlf-net

  # --- CLI for channel/chaincode operations ---
  cli:
    container_name: hlf-cli
    image: hyperledger/fabric-tools:2.5
    tty: true
    stdin_open: true
    environment:
      - GOPATH=/opt/gopath
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_ID=cli
      - CORE_PEER_ADDRESS=peer0.org1.ssi.network:7051
      - CORE_PEER_LOCALMSPID=Org1MSP
      - CORE_PEER_MSPCONFIGPATH=/opt/gopath/src/github.com/hyperledger/fabric/peer/crypto/peerOrganizations/org1.ssi.network/users/Admin@org1.ssi.network/msp
      - CORE_PEER_TLS_ENABLED=false
    volumes:
      - /var/run/docker.sock:/host/var/run/docker.sock
      - ./crypto-config:/opt/gopath/src/github.com/hyperledger/fabric/peer/crypto
      - ./channel-artifacts:/opt/gopath/src/github.com/hyperledger/fabric/peer/channel-artifacts
      - ./scripts:/scripts
      - ../../chaincode:/opt/gopath/src/github.com/chaincode
    depends_on:
      - peer0.org1.ssi.network
      - peer0.org2.ssi.network
    networks:
      - hlf-net

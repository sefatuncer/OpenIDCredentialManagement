groups:
  - name: ai-identity-alerts
    rules:
      - alert: HighErrorRate
        expr: rate(errors_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: High error rate detected
          description: Error rate is {{ $value }} errors/sec

      - alert: HighRequestLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: High request latency
          description: 95th percentile latency is {{ $value }}s

      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Service is down
          description: "{{ $labels.job }} has been down for more than 1 minute"

      - alert: HighRateLimitHits
        expr: rate(rate_limit_hits_total[5m]) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: High rate of rate limit hits
          description: Rate limit being hit frequently

      - alert: AuthFailures
        expr: rate(auth_attempts_total{result="failure"}[5m]) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: High authentication failure rate
          description: Auth failure rate is {{ $value }} per second

  - name: ai-agent-alerts
    rules:
      - alert: AgentEmergencyStop
        expr: increase(agent_emergency_stops_total[5m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: Agent emergency stop triggered
          description: An agent was emergency stopped in the last 5 minutes

      - alert: HighAgentCredentialRevocations
        expr: rate(agent_credential_revocations_total[10m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: High credential revocation rate
          description: Credential revocation rate is {{ $value }} per second

      - alert: SuspiciousAgentActivity
        expr: rate(agent_suspicious_actions_total[5m]) > 0.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Suspicious agent activity detected
          description: Agent {{ $labels.agent_did }} showing suspicious behavior

      - alert: HighCapabilityRevocations
        expr: increase(agent_capability_revocations_total[1h]) > 10
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: High number of capability revocations
          description: "{{ $value }} capabilities revoked in the last hour"

      - alert: TrustDowngradeSpike
        expr: increase(agent_trust_downgrades_total[1h]) > 5
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: Multiple trust downgrades detected
          description: "{{ $value }} agents had trust downgraded in the last hour"

      - alert: CredentialRequestRejectionRate
        expr: rate(credential_requests_total{status="rejected"}[10m]) / rate(credential_requests_total[10m]) > 0.3
        for: 10m
        labels:
          severity: info
        annotations:
          summary: High credential request rejection rate
          description: "{{ $value | humanizePercentage }} of credential requests are being rejected"

      - alert: OrganizationAgentLimitApproaching
        expr: agent_count_per_organization > 80
        for: 0m
        labels:
          severity: info
        annotations:
          summary: Organization approaching agent limit
          description: "Organization {{ $labels.organization }} has {{ $value }} agents (limit: 100)"

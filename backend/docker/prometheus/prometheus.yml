global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'api-gateway'
    static_configs:
      - targets: ['api-gateway:3000']
    metrics_path: /metrics

  - job_name: 'issuer'
    static_configs:
      - targets: ['issuer:3001']
    metrics_path: /metrics

  - job_name: 'verifier'
    static_configs:
      - targets: ['verifier:3002']
    metrics_path: /metrics

  - job_name: 'holder'
    static_configs:
      - targets: ['holder:3003']
    metrics_path: /metrics

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']

services:
  backend:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - ./src:/app/src
      - ./data:/app/data
    environment:
      - NODE_ENV=development
      - API_PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-ssi_user}:${POSTGRES_PASSWORD:-ssi_password}@postgres:5432/${POSTGRES_DB:-ssi_db}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: ssi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ssi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ssi_password}
      POSTGRES_DB: ${POSTGRES_DB:-ssi_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ssi_user} -d ${POSTGRES_DB:-ssi_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ssi-pgadmin
    restart: unless-stopped
    profiles:
      - tools
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@localhost.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

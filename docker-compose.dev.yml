name: oidcm

services:
  postgres:
    image: postgres:15-alpine
    container_name: ssi-postgres
    environment:
      POSTGRES_USER: ssi_dev
      POSTGRES_PASSWORD: ssi_dev_pass
      POSTGRES_DB: ssi_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ssi_dev -d ssi_dev"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ssi-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - API_PORT=3000
      - API_BASE_URL=http://62.244.233.69:3000
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost:5174,http://62.244.233.69:3000,http://62.244.233.69:5173,http://62.244.233.69:5174
      - JWT_SECRET=dev-jwt-secret-docker-only
      - API_KEY=dev-api-key-docker-only
      - WEB_WALLET_SECRET=dev-wallet-secret-docker-only
      - DATABASE_URL=postgresql://ssi_dev:ssi_dev_pass@postgres:5432/ssi_dev
      - CREDO_WALLET_KEY=dev-credo-wallet-key-docker-only
      - CREDO_WALLET_ID=ai-agent-wallet-dev
      - ISSUER_BASE_URL=http://backend:3000
      - VERIFIER_BASE_URL=http://backend:3000
      - KEYCLOAK_REALM_URL=http://keycloak:8080/realms/ssi
      - KEYCLOAK_CLIENT_ID=ssi-backend
      - KEYCLOAK_CLIENT_SECRET=ssi-backend-secret-change-in-production
      - KEYCLOAK_FRONTEND_CLIENT_ID=ssi-frontend
    volumes:
      - ./backend/data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  web-wallet:
    build:
      context: ./web-wallet
      dockerfile: Dockerfile
    container_name: ssi-web-wallet
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: ssi-keycloak
    command: start-dev --import-realm
    environment:
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://postgres:5432/ssi_dev
      - KC_DB_USERNAME=ssi_dev
      - KC_DB_PASSWORD=ssi_dev_pass
      - KC_DB_SCHEMA=keycloak
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_HEALTH_ENABLED=true
      - KC_HTTP_PORT=8080
    ports:
      - "8080:8080"
    volumes:
      - ./backend/docker/keycloak/ssi-realm.json:/opt/keycloak/data/import/ssi-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\n\r\n' >&3 && cat <&3 | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  issuer-verifier-dashboard:
    build:
      context: ./frontend-issuer-verifier
      dockerfile: Dockerfile
    container_name: ssi-issuer-verifier
    ports:
      - "5174:5174"
    depends_on:
      - backend
    restart: unless-stopped

networks:
  default:
    name: ssi-network

volumes:
  postgres_dev_data:
    driver: local
